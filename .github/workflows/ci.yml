name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sim]"
      - name: Unit and end-to-end tests (no browser)
        run: python -m pytest -q -m "not slow"
      - name: Mock-storefront validation, every scenario
        run: python scripts/validate_mock.py
      - name: v0 versus corrected detector
        run: python scripts/compare_v0.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Real-browser end-to-end
        run: python -m pytest -q -m slow
