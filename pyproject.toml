[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd"
version = "0.1.0"
description = "Instrument for the price discrimination measurement study"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
sim = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.8"]
docs = ["reportlab>=4.0"]   # scripts/make_paper.py; the deck needs node + pptxgenjs
browser = ["playwright>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: needs a real browser; deselect with -m 'not slow'"]
